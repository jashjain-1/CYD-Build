; CYD-Build — PlatformIO environments.
;
;   cyd            → ESP32-2432S028R "Cheap Yellow Display" (DEFAULT target:
;                    Techtonics TECH2554, single micro-USB variant). ILI9341 on
;                    HSPI, bit-banged XPT2046 touch, backlight GPIO21, GPS UART2
;                    on GPIO27/22 (JST expansion port).
;   esp32dev       → Legacy DevKit + separate SPI display build (pre-CYD wiring).
;   esp32dev_audio → esp32dev with the optional GPIO25 LEDC tone output enabled.
;   sim            → Host-testable simulation build of the service/UI logic.
;
; Audio stays OFF by default in every environment (docs/DECISIONS.md ADR-0004);
; esp32dev_audio is the only env that enables it.
;
; Pin direct dependencies for repeatable resolution. Full device builds are
; required when updating these versions (Arduino core 2.x LEDC API).
;
; Dependency pins vs. the registry state at time of writing:
;   Adafruit ILI9341  1.6.0 is no longer published — pinned to 1.6.4 (same 1.6.x
;                     API line) so resolution is reproducible.
;   XPT2046_Touchscreen is only published on the registry as an alpha version;
;                     pinned to the canonical GitHub tag #v1.4 (the upstream
;                     release that the registry's 1.4.x line tracks).
[platformio]
default_envs = cyd

[env]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit ILI9341@1.6.4
    mikalhart/TinyGPSPlus@1.1.0

[env:cyd]
build_flags = -DSIM_BUILD=0 -DHEAD_UNIT_TARGET_CYD=1

[env:esp32dev]
build_flags = -DSIM_BUILD=0 -DHEAD_UNIT_TARGET_DEVKIT=1
lib_deps =
    ${env.lib_deps}
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

[env:sim]
build_flags = -DSIM_BUILD=1 -DHEAD_UNIT_TARGET_CYD=1

[env:esp32dev_audio]
extends = env:esp32dev
build_flags = -DSIM_BUILD=0 -DHEAD_UNIT_TARGET_DEVKIT=1 -DAUDIO_ENABLED=1
