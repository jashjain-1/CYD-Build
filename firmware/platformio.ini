; DashCue firmware build definition (DEC-02, DEC-03, DEC-05, DEC-24).
;
; Every dependency is pinned to an exact version - no caret ranges. The spec
; requires reproducible builds, and GATE-08 records the exact version that was
; compiled and flash-tested. See docs/DEPENDENCIES.md for the evidence behind
; each pin.
;
; Environments (spec §18)
;   cyd_ili9341  product build for ST7796 480x320 panel with 80MHz SPI and XPT2046 touch
;   cyd_st7789   product build for ST7789-panel CYD revisions
;   diag         diagnostic build (DEC-27): self-tests, counters, screenshot dump
;   native       host unit tests for hardware-independent logic (spec §19.3)
;
; The GATE-02/03/04 hardware probe is NOT here: it is a separate project under
; tools/hw_probe/ so that a probe failure can never be confused with a UI failure.
;
; Usage:  python tools/build_fw.py --env cyd_ili9341
;         python tools/flash_fw.py --port COM4
;         pio test -e native

[platformio]
boards_dir = ../boards
default_envs = cyd_ili9341

[env]
platform = espressif32 @ 7.1.3
board = cyd_2432s028r
upload_port = COM3
upload_speed = 460800
monitor_port = COM3
monitor_speed = 115200
; Arduino's ESP32 core defaults to gnu++11; the spec mandates C++17 (DEC-02).
build_unflags =
  -std=gnu++11
  -std=gnu++14
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wno-unused-parameter
  -DDASHCUE_FW_BUILD=1
  -DDASHCUE_PROTO_MAJOR=1
  -DDASHCUE_PROTO_MINOR=0
; ---------------------------------------------------------------------------
; TFT_eSPI is configured from build flags rather than a checked-in User_Setup.h:
; the pin map then lives in one place (include/dashcue_config.h) and the
; library's own config cannot drift between machines. These pins are the ones
; GATE-02 measured on the physical board.
; ---------------------------------------------------------------------------
lib_ldf_mode = chain
test_framework = unity

[env:cyd_ili9341]
framework = arduino
build_flags =
  ${env.build_flags}
  -DUSER_SETUP_LOADED=1
  -DST7796_DRIVER=1
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DTOUCH_CS=33
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  ; LVGL finds its configuration as "lv_conf.h" on the include path, which is
  ; firmware/include/lv_conf.h - generated by tools/gen_lv_conf.py. Without this
  ; LVGL looks for the file next to the library directory and fails.
  -DLV_CONF_INCLUDE_SIMPLE=1
  -DDASHCUE_ENABLE_A2DP=1
  -Iinclude
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  lvgl/lvgl@9.6.0
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.2

  nanopb/Nanopb@0.4.92
  SPI
  Wire
  FS
  SPIFFS

[env:cyd_st7789]
; Same product, different panel controller. UNTESTED on the board measured by
; GATE-02 (which drives its panel correctly with the ILI9341 configuration);
; this environment exists so a ST7789 revision needs a build flag change only.
extends = env:cyd_ili9341
build_flags =
  ${env:cyd_ili9341.build_flags}
  -DST7789_DRIVER=1
  -DTFT_RGB_ORDER=TFT_BGR

[env:diag]
; DEC-27 diagnostic build: adds the USB-serial command console, self-tests and
; the counters needed by TC-HW-07/08/11. Release artefacts must not contain it,
; which tools/check_release_scan.py verifies.
extends = env:cyd_ili9341
build_flags =
  ${env:cyd_ili9341.build_flags}
  -DHUD_DIAG=1
  -DDASHCUE_DIAG_SERIAL_COMMAND_CONSOLE=1

[env:native]
; Host tests for hardware-independent logic (§19.3). These compile the SAME
; sources the firmware compiles (src/protocol, src/state, src/touch), so a green
; native test is evidence about the device code path rather than a parallel
; implementation that happens to agree with itself.
platform = native
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -DDASHCUE_NATIVE_TEST=1
  -DUNITY_SUPPORT_64=1
build_src_filter = +<protocol/> +<state/> +<touch/> -<touch/touch_hal.*> -<touch/calibration_screen.*>
test_build_src = true
lib_deps =
  nanopb/Nanopb @ 0.4.92
test_testing_command =
  powershell
  -ExecutionPolicy
  Bypass
  -File
  run_native_test.ps1

; Flash/RAM headroom (§16: app partition >= 25 % free) is measured with the
; built-in `pio run -e <env> -t size` target and recorded in docs/evidence/.
