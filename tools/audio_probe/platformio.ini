[platformio]
boards_dir = ../../boards
default_envs = audio_probe

[env:audio_probe]
platform = espressif32 @ 7.1.3
board = cyd_2432s028r
framework = arduino
upload_port = COM3
upload_speed = 921600
monitor_port = COM3
monitor_speed = 115200
board_build.partitions = ../../firmware/partitions.csv
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
