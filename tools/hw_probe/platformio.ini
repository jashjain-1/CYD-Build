; GATE-02/03/04 hardware probe (spec §4, §18).
;
; This is DELIBERATELY a separate PlatformIO project from firmware/. Reasons:
;   * it must be flashable on a board whose revision we do not know yet, so it
;     cannot depend on the product's board profile or LVGL
;   * if it fails, the fault is hardware - not the UI stack - which is the whole
;     point of isolating it (see GATE-02/03 in docs/VERIFICATION.md)
;
; Usage:
;   python tools/flash_fw.py --probe --port COM4
;   python tools/test-only/serial_harness/capture.py --port COM4 --seconds 12 \
;       --out docs/evidence/<date>/TC-HW-01/hw_probe.log

[platformio]
boards_dir = ../../boards
default_envs = hw_probe

[env:hw_probe]
platform = espressif32 @ 7.1.3
board = cyd_2432s028r
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; The board profile points at firmware/partitions.csv (resolved relative to that
; project's directory), so this project states it explicitly instead.
board_build.partitions = ../../firmware/partitions.csv
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wno-unused-parameter
  ; shared version/config headers with the product firmware
  -I../../firmware/include
  ; TFT_eSPI configuration (kept identical to firmware/platformio.ini so the
  ; probe exercises the same display stack the product will use)
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DTOUCH_CS=33
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
lib_ldf_mode = deep+
