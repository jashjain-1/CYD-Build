name: Firmware CI

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - 'protocol/**'
      - 'tools/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - 'protocol/**'
      - 'tools/**'
      - '.github/workflows/firmware.yml'

jobs:
  preflight_gates:
    name: Preflight Drift & Token Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Preflight Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install protobuf

      - name: Contrast Token Audit (WCAG 2.1 AA/AAA Gate)
        run: python tools/contrast_check.py

      - name: Dependency Pinning Check (GATE-08)
        run: python tools/check_dependency_pins.py

  native_host_tests:
    name: Native Firmware Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-native-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-native-${{ runner.os }}-

      - name: Run Native Firmware Unit Tests (Unity)
        working-directory: firmware
        run: pio test -e native -v

  firmware_compilation:
    name: ESP32 CYD Firmware Compilation & Memory Gate
    runs-on: ubuntu-latest
    needs: [preflight_gates]
    strategy:
      fail-fast: false
      matrix:
        env: [cyd_ili9341, cyd_st7789]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio pyelftools protobuf grpcio-tools

      - name: Cache PlatformIO packages & toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-fw-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-fw-${{ runner.os }}-

      - name: Install PlatformIO Dependencies (${{ matrix.env }})
        working-directory: firmware
        run: pio pkg install -e ${{ matrix.env }}

      - name: Verify Protocol Generation Drift (DEC-12)
        run: python tools/gen_proto.py --check

      - name: Verify LVGL Configuration Drift
        run: python tools/gen_lv_conf.py --check

      - name: Compile ESP32 CYD Firmware (${{ matrix.env }})
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}

      - name: Static DRAM & Flash Headroom Gate (§16 & Priority 4)
        run: |
          python tools/memory_report.py \
            firmware/.pio/build/${{ matrix.env }}/firmware.elf \
            --binary firmware/.pio/build/${{ matrix.env }}/firmware.bin \
            --out docs/evidence/memory_report_${{ matrix.env }}.json
          
          # Enforce <= 70 KB static DRAM limit (71680 bytes)
          python -c "
          import json, sys
          data = json.load(open('docs/evidence/memory_report_${{ matrix.env }}.json'))
          dram = data['dram_static_bytes']
          headroom = data['flash']['headroom_percent']
          print(f'Static DRAM: {dram} bytes / 70000 bytes max')
          print(f'Flash headroom: {headroom}% / >= 25% min')
          if dram > 71680:
              sys.exit(f'ERROR: Static DRAM exceeds 70 KB budget: {dram} bytes')
          if headroom < 25.0:
              sys.exit(f'ERROR: Flash partition headroom below 25%: {headroom}%')
          print('PASS: Memory and headroom budgets strictly met.')
          "

      - name: Upload Firmware Artifacts (${{ matrix.env }})
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/firmware.bin
            firmware/.pio/build/${{ matrix.env }}/firmware.elf
            firmware/.pio/build/${{ matrix.env }}/bootloader.bin
            firmware/.pio/build/${{ matrix.env }}/partitions.bin
            docs/evidence/memory_report_${{ matrix.env }}.json
          retention-days: 14
