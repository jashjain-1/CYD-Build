name: Android Companion CI

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'

jobs:
  unit_tests:
    name: Android Unit & Robolectric Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --continue --no-daemon -Dkotlin.incremental=false

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: |
            android/**/build/reports/tests/testDebugUnitTest/
            android/**/build/test-results/testDebugUnitTest/
          retention-days: 14

  lint_and_assembly:
    name: Android Lint & Debug Assembly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Run Android Lint (Debug)
        working-directory: android
        run: ./gradlew lintDebug --no-daemon -Dkotlin.incremental=false

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -Dkotlin.incremental=false

      - name: Upload Debug APK & Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-artifacts
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/lint-results-debug.html
          retention-days: 14
